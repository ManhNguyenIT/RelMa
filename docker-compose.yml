  apiservice:
    container_name: ApiService
    image: ${DOCKER_REGISTRY-}apiservice
    networks:
      - local-network
    build:
      context: .
      dockerfile: src/RelMa.ApiService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8081:8080"
    # depends_on:
    #   - postgres
    #   - keycloak
    #   - redis

  webapp:
    container_name: WebApp
    image: ${DOCKER_REGISTRY-}web
    networks:
      - local-network
    build:
      context: ./src/RelMa.Web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - apiservice
